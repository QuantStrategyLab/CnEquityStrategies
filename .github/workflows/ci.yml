name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Actionlint
        uses: docker://rhysd/actionlint:1.7.12

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whitespace
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

      - name: Resolve QuantPlatformKit ref
        id: quant-platform-kit-ref
        run: |
          set -euo pipefail
          ref="$(python3 - <<'PYTHON'
          import re, tomllib
          with open("pyproject.toml", "rb") as stream:
              deps = tomllib.load(stream)["project"]["dependencies"]
          matches = [re.fullmatch(r"quant-platform-kit @ git\+https://github.com/QuantStrategyLab/QuantPlatformKit\.git@([0-9a-f]{40})", dep) for dep in deps]
          pins = [match.group(1) for match in matches if match]
          if len(pins) != 1:
              raise SystemExit("exact consumer QPK pin required")
          print(pins[0])
          PYTHON
          )"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout QuantPlatformKit
        uses: actions/checkout@v6
        with:
          repository: QuantStrategyLab/QuantPlatformKit
          ref: ${{ steps.quant-platform-kit-ref.outputs.ref }}
          path: external/QuantPlatformKit

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]" pandas pytest pytest-cov ruff==0.15.22 build

      - name: Verify dependencies
        run: |
          set -euo pipefail
          python -m pip check

      - name: Run Ruff
        run: |
          set -euo pipefail
          ruff check --exclude external .

      - name: Check QPK pin and lock consistency
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.quant-platform-kit-ref.outputs.ref }}' > "${RUNNER_TEMP}/consumer-qpk-pin"
          python external/QuantPlatformKit/scripts/check_qpk_pin_consistency.py \
            --root . \
            --pin-file "${RUNNER_TEMP}/consumer-qpk-pin"

      - name: Run unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q tests --cov --cov-report=term --cov-report=xml

      - name: Build package
        run: |
          set -euo pipefail
          python -m build
